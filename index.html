<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Character Counter</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-gray-100 px-4 py-8 font-sans text-gray-800 sm:py-12">
    <main class="mx-auto max-w-2xl overflow-hidden rounded-xl border border-green-200 bg-white shadow-lg">
        <header class="bg-green-100 px-6 py-8 sm:px-10">
            <h1 class="mb-2 text-3xl font-bold text-green-900">Write a message</h1>
            <p class="text-green-900">Maximum 200 characters.</p>
        </header>
        <section class="p-6 sm:p-10">
            <label for="message" class="mb-2 block font-bold">Your message</label>
            <textarea id="message" rows="8" maxlength="200" placeholder="Type your message here..." class="w-full resize-y rounded-lg border border-gray-300 bg-gray-50 p-4 outline-none focus:border-green-600"></textarea>
            <div class="mt-4 flex flex-wrap justify-between gap-3" aria-live="polite">
                <span id="counter" class="rounded-lg bg-green-100 px-3 py-2 text-sm font-semibold text-green-900">0/200 characters - 200 remaining</span>
                <span id="warning" class="text-sm text-red-600" role="status"></span>
            </div>
        </section>
    </main>
    <script>
        const message = document.querySelector('#message');
        const counter = document.querySelector('#counter');
        const warning = document.querySelector('#warning');
        const max = message.maxLength;

        message.addEventListener('input', () => {
            const count = message.value.length;
            counter.textContent = `${count}/${max} characters - ${max - count} remaining`;
            warning.textContent = count === max ? 'Character limit reached.' : '';
        });
    </script>
</body>
</html>
